[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "feedwatch"
version = "0.3.0"
description = "Real-time market-data ingestion with lag metrics, stale-data detection and confirmed reads."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aleksander Wisniewski" }]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "ruff==0.15.11", "mypy==1.20.2"]

[project.scripts]
feedwatch = "feedwatch.cli:main"

[tool.setuptools]
packages = ["feedwatch"]

[tool.setuptools.package-data]
feedwatch = ["schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
